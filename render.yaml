services:
  - type: web
    name: ndangira-backend
    env: node
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SENDGRID_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        value: dh8e4duii
      - key: CLOUDINARY_API_KEY
        value: 457738354933555
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: PORT
        value: 10000